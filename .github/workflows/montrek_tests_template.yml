name: Montrek TestSuite Template

on:
  workflow_call:
    inputs:
      montrek_base_version:
        required: true
        type: string
      montrek_project:
        required: true
        type: string
      mt_cloud_ref:
        required: false
        type: string
        default: "" # empty means "don't clone"
      mt_economic_common_ref:
        required: false
        type: string
        default: "" # empty means "don't clone"
      mt_tools_ref:
        required: false
        type: string
        default: "" # empty means "don't clone"
      mt_llm_ref:
        required: false
        type: string
        default: "" # empty means "don't clone"
    secrets:
      PAT:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide if tests should run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/github-script@v7
        id: decide
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            //
            // --- Determine last run info
            //
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 50
            });
            const wfName = context.workflow;
            const runs = data.workflow_runs.filter(r => r.name === wfName);
            const currentId = context.runId;
            const lastRun = runs.find(r => r.id !== currentId) || runs[0];
            const lastConclusion = lastRun?.conclusion || 'none';
            const lastRunAt = lastRun?.updated_at || '1970-01-01T00:00:00Z';

            //
            // --- Collect dependency repos
            //
            const org = "montrek-software";
            const deps = [];

            function maybe(depRepo, branch) {
              if (branch && branch.trim() !== "") {
                deps.push({ owner: org, repo: depRepo, branch: branch.trim() });
              }
            }

            maybe("montrek",              core.getInput("montrek_base_version"));
            maybe("mt_cloud",             core.getInput("mt_cloud_ref");
            maybe("mt_economic_common",   core.getInput("mt_economic_common_ref");
            maybe("mt_tools",             core.getInput("mt_tools_ref");
            maybe("mt_llm",               core.getInput("mt_llm_ref"));

            //
            // --- Check each dependency for changes
            //
            core.info("Dependency inputs:");
            core.info(`INPUT_MONTREK_BASE_VERSION='${core.getInput("montrek_base_version"))}'`);
            core.info(`INPUT_MT_CLOUD_REF='${core.getInput("mt_cloud_ref")}'`);
            core.info(`INPUT_MT_ECONOMIC_COMMON_REF='${core.getInput("mt_economic_common_ref")}'`);
            core.info(`INPUT_MT_TOOLS_REF='${core.getInput("mt_tools_ref")}'`);
            core.info(`INPUT_MT_LLM_REF='${core.getInput("mt_llm_ref"))}'`);

            core.info("Building deps list...");
            let depsChanged = false;

            for (const d of deps) {
              try {
                // 1) Get branch HEAD SHA
                const ref = await github.rest.git.getRef({
                  owner: d.owner,
                  repo: d.repo,
                  ref: `heads/${d.branch}`
                });

                const latestSha = ref.data.object.sha;

                // 2) Get the commit timestamp
                const commit = await github.rest.repos.getCommit({
                  owner: d.owner,
                  repo: d.repo,
                  ref: latestSha
                });

                const commitTime = commit.data.commit.committer.date;
                core.info(`Checking ${d.repo}/${d.branch}`);

                core.info(` - latestSha: ${latestSha}`);
                core.info(` - commitTime: ${commitTime}`);
                core.info(` - lastRunAt: ${lastRunAt}`);
                core.info(` - newer? ${new Date(commitTime) > new Date(lastRunAt)}`);

                // 3) Compare timestamps
                if (new Date(commitTime) > new Date(lastRunAt)) {
                  depsChanged = true;
                  break;
                }
              } catch (err) {
                core.warning(`Failed checking dependency ${d.repo}/${d.branch}: ${err.message}`);
              }
            }
            core.info(`deps = ${JSON.stringify(deps, null, 2)}`);

            const isSchedule = context.eventName === 'schedule';
            const lastFailed = lastConclusion !== 'success';

            const shouldRun = isSchedule ? (depsChanged || lastFailed) : true;

            core.info(`event=${context.eventName} depsChanged=${depsChanged} lastConclusion=${lastConclusion} lastRunAt=${lastRunAt} => shouldRun=${shouldRun}`);

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('reason',
              isSchedule
                ? (depsChanged ? 'deps_changed' : (lastFailed ? 'last_failed' : 'quiet'))
                : 'direct_trigger'
            );

  build:
    name: Run Montrek tests
    needs: decide
    if: github.event_name != 'schedule' || needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/montrek-software/montrek-container:latest
      options: --user 0:0
    strategy:
      max-parallel: 4

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_pipe_pssw
          POSTGRES_DB: montrek_ci_pipe_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Clone Montrek Repository
        uses: actions/checkout@v4
        with:
          repository: chrishombach/montrek
          token: ${{ secrets.PAT }}
          path: ./montrek
          ref: ${{ inputs.montrek_base_version }}

      - name: Clone mt_cloud
        if: inputs.mt_cloud_ref != ''
        uses: actions/checkout@v4
        with:
          repository: montrek-software/mt_cloud
          token: ${{ secrets.PAT }}
          path: ./montrek/montrek/mt_cloud
          ref: ${{ inputs.mt_cloud_ref }}

      - name: Clone mt_economic_common
        if: inputs.mt_economic_common_ref != ''
        uses: actions/checkout@v4
        with:
          repository: montrek-software/mt_economic_common
          token: ${{ secrets.PAT }}
          path: ./montrek/montrek/mt_economic_common
          ref: ${{ inputs.mt_economic_common_ref }}

      - name: Clone mt_tools
        if: inputs.mt_tools_ref != ''
        uses: actions/checkout@v4
        with:
          repository: montrek-software/mt_tools
          token: ${{ secrets.PAT }}
          path: ./montrek/montrek/mt_tools
          ref: ${{ inputs.mt_tools_ref }}

      - name: Clone mt_llm
        if: inputs.mt_llm_ref != ''
        uses: actions/checkout@v4
        with:
          repository: montrek-software/mt_llm
          token: ${{ secrets.PAT }}
          path: ./montrek/montrek/mt_llm
          ref: ${{ inputs.mt_llm_ref }}

      - name: Checkout PR code or main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ./montrek/montrek/${{ inputs.montrek_project }}

      - name: Install Python Dependencies
        run: cd montrek && make sync-local-python-env

      - name: Setup env
        run: |
          ENVPATH="./montrek/.env"
          echo "DB_ENGINE=postgres" >> $ENVPATH
          echo "DB_PORT=5432" >> $ENVPATH
          echo "DB_USER=postgres" >> $ENVPATH
          echo "DB_PASSWORD=ci_pipe_pssw" >> $ENVPATH
          echo "DB_NAME=montrek_ci_pipe_db" >> $ENVPATH
          echo "DB_HOST=postgres" >> $ENVPATH
          echo "SECRET_KEY=testkey" >> $ENVPATH

      - name: Run Tests
        run: |
          cd montrek
          . .venv/bin/activate
          cd montrek
          python manage.py test ${{ inputs.montrek_project }} --exclude-tag=functional --parallel
